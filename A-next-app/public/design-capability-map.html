<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设计能力地图</title>
  <style>
    :root {
      --ink: #18181b;
      --subtle-ink: #71717a;
      --muted-ink: #a1a1aa;
      --line: #e9e9ee;
      --line-strong: #dadbe3;
      --panel: rgba(255,255,255,.88);
      --panel-strong: #fff;
      --purple: #7067e8;
      --purple-soft: #f0efff;
      --cyan-soft: #e8fbfb;
      --orange: #df8a3d;
      --orange-soft: #fff3e8;
      --shadow: 0 18px 50px rgba(32, 35, 52, .07);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        linear-gradient(rgba(112,103,232,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(112,103,232,.035) 1px, transparent 1px),
        radial-gradient(circle at 18% 7%, rgba(121,106,255,.07), transparent 25%),
        radial-gradient(circle at 86% 1%, rgba(44,207,205,.07), transparent 23%),
        #fbfbfc;
      background-size: 32px 32px, 32px 32px, auto, auto, auto;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1500px, calc(100% - 56px));
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr minmax(360px, 610px);
      gap: 40px;
      align-items: end;
      padding: 12px 8px 30px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 650;
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 680px;
      color: var(--subtle-ink);
      font-size: 15px;
      line-height: 1.8;
    }

    .search-border {
      padding: 1.5px;
      border-radius: 999px;
      background: linear-gradient(100deg, #80e5e5, #8b7cf2 34%, #f1c261 67%, #ee8bc2);
      box-shadow: 0 10px 26px rgba(112,103,232,.08);
    }

    .header-tools {
      display: grid;
      gap: 10px;
    }

    .global-network-button {
      justify-self: end;
      padding: 10px 15px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(24,24,27,.13);
    }

    .global-network-button::before { content: "✦ "; color: #bcb5ff; }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px 4px 22px;
      border-radius: inherit;
      background: rgba(255,255,255,.96);
    }

    .search input {
      width: 100%;
      height: 48px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
    }

    .search input::placeholder { color: #a8a8b0; }

    .search-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 18px;
    }

    .primary-nav {
      display: flex;
      gap: 34px;
      align-items: center;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
    }

    .primary-tab {
      position: relative;
      padding: 16px 0 18px;
      border: 0;
      background: transparent;
      color: var(--subtle-ink);
      font-size: 16px;
      cursor: pointer;
    }

    .primary-tab.active {
      color: var(--purple);
      font-weight: 650;
    }

    .primary-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 3px;
      border-radius: 99px 99px 0 0;
      background: var(--purple);
    }

    .secondary-wrap {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -16px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(233,233,238,.92);
      background: rgba(251,251,252,.86);
      backdrop-filter: blur(16px);
    }

    .secondary-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .secondary-nav::-webkit-scrollbar { display: none; }

    .secondary-tab,
    .filter-button {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: #55555f;
      cursor: pointer;
      transition: .2s ease;
    }

    .secondary-tab:hover,
    .filter-button:hover { background: #f0f0f3; }

    .secondary-tab.active {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 5px 14px rgba(24,24,27,.14);
    }

    main { padding: 32px 0 0; }

    .overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: start;
      margin-bottom: 24px;
    }

    .overview h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 650;
    }

    .overview p {
      margin: 10px 0 0;
      max-width: 820px;
      color: var(--subtle-ink);
      font-size: 14px;
      line-height: 1.8;
    }

    .stats {
      display: flex;
      gap: 10px;
    }

    .stat {
      min-width: 92px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
    }

    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1;
      font-weight: 650;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted-ink);
      font-size: 11px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }

    .toolbar-title {
      color: var(--subtle-ink);
      font-size: 13px;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: #f0f0f3;
    }

    .filter-button {
      padding: 7px 12px;
      font-size: 12px;
    }

    .filter-button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(24,24,27,.08);
    }

    .atom-panel { padding: 24px; }

    .atom-group + .atom-group { margin-top: 24px; }

    .group-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 650;
    }

    .group-heading small {
      color: var(--muted-ink);
      font-size: 11px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
    }

    .status-dot.planned { background: var(--orange); }

    .capsules {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .capsule {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255,255,255,.76);
      color: #55555f;
      font-size: 12px;
      line-height: 1.35;
      transition: .18s ease;
    }

    .capsule.planned {
      border-color: #ead7c5;
      background: rgba(255,248,241,.8);
      color: #9a673c;
    }

    .capsule.selected {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(24,24,27,.14);
    }

    .capsule.planned.selected {
      border-color: var(--orange);
      background: var(--orange);
      color: #fff;
      box-shadow: 0 6px 16px rgba(223,138,61,.18);
    }

    .empty {
      padding: 42px 20px;
      color: var(--muted-ink);
      text-align: center;
      font-size: 13px;
    }

    .stage-panel {
      padding: 22px;
      margin-bottom: 18px;
    }

    .stage-flow {
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stage-flow::-webkit-scrollbar { display: none; }

    .stage-step {
      position: relative;
      min-width: 176px;
      flex: 1 0 176px;
      padding-right: 28px;
    }

    .stage-step:not(:last-child)::after {
      content: "→";
      position: absolute;
      right: 8px;
      top: 22px;
      color: #b7b7c0;
      font-size: 18px;
    }

    .stage-button {
      width: 100%;
      min-height: 70px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.74);
      text-align: left;
      cursor: pointer;
      transition: .2s ease;
    }

    .stage-button:hover {
      border-color: #cfcfe0;
      transform: translateY(-1px);
    }

    .stage-button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
      box-shadow: 0 8px 22px rgba(24,24,27,.13);
    }

    .stage-index {
      display: block;
      margin-bottom: 8px;
      color: var(--muted-ink);
      font-size: 10px;
      letter-spacing: .12em;
    }

    .stage-button.active .stage-index { color: rgba(255,255,255,.58); }

    .stage-name {
      display: block;
      font-size: 14px;
      font-weight: 650;
    }

    .stage-count {
      display: block;
      margin-top: 5px;
      color: var(--muted-ink);
      font-size: 11px;
    }

    .stage-button.active .stage-count { color: rgba(255,255,255,.62); }

    .selected-stage {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .selected-stage b {
      font-size: 14px;
      font-weight: 650;
    }

    .selected-stage span {
      margin-left: 10px;
      color: var(--subtle-ink);
      font-size: 13px;
    }

    .solution-section {
      margin-bottom: 18px;
      padding: 22px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 16px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .section-heading p {
      margin: 5px 0 0;
      color: var(--muted-ink);
      font-size: 12px;
    }

    .clear-button {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--subtle-ink);
      font-size: 12px;
      cursor: pointer;
    }

    .solution-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .solution-card {
      position: relative;
      min-height: 142px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.76);
      text-align: left;
      cursor: pointer;
      transition: .2s ease;
    }

    .solution-card:hover {
      border-color: #cfcfe0;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(34,34,44,.06);
    }

    .solution-card.active {
      border-color: var(--purple);
      background:
        linear-gradient(135deg, rgba(112,103,232,.09), rgba(74,207,205,.05)),
        #fff;
      box-shadow: 0 10px 28px rgba(112,103,232,.11);
    }

    .solution-number {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: #f0f0f3;
      color: var(--subtle-ink);
      font-size: 11px;
      font-weight: 700;
    }

    .solution-card.active .solution-number {
      background: var(--purple);
      color: #fff;
    }

    .solution-card h4 {
      margin: 15px 0 7px;
      font-size: 15px;
      font-weight: 650;
    }

    .solution-card p {
      margin: 0;
      color: var(--subtle-ink);
      font-size: 12px;
      line-height: 1.6;
    }

    .solution-meta {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted-ink);
      font-size: 10px;
    }

    .solution-card.active .solution-meta { color: var(--purple); }

    .method-panel {
      margin-bottom: 18px;
      padding: 24px;
      overflow: hidden;
    }

    .method-heading {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .method-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .14em;
    }

    .method-heading h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .method-heading p {
      margin: 7px 0 0;
      color: var(--subtle-ink);
      font-size: 12px;
      line-height: 1.7;
    }

    .method-rule {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 20px;
      padding: 11px 13px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(112,103,232,.08), rgba(70,207,205,.055));
      color: var(--subtle-ink);
      font-size: 11px;
    }

    .method-rule b {
      color: var(--ink);
      font-weight: 650;
    }

    .method-rule span:not(:last-child)::after {
      content: "·";
      margin-left: 7px;
      color: #b0b0bc;
    }

    .method-canvas {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(250px, 1fr);
      gap: 14px;
      padding: 34px 2px 4px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #d6d6df transparent;
    }

    .method-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 20px 16px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.62);
    }

    .method-stage::before {
      content: "";
      position: absolute;
      left: 0;
      right: -15px;
      top: -19px;
      height: 1px;
      background: #d8d8e2;
    }

    .method-stage:last-child::before { right: 50%; }

    .method-stage:not(:last-child)::after {
      content: "›";
      position: absolute;
      z-index: 2;
      right: -12px;
      top: -31px;
      color: #9c9ca8;
      font-size: 24px;
      line-height: 24px;
      background: #fbfbfc;
    }

    .method-marker {
      position: absolute;
      top: -29px;
      left: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 3px solid #fbfbfc;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 8px;
      font-weight: 750;
      box-shadow: 0 0 0 1px #d8d8e2;
    }

    .method-stage-label {
      color: var(--purple);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .13em;
    }

    .method-stage h4 {
      margin: 8px 0 7px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .method-stage-goal {
      min-height: 54px;
      margin: 0;
      color: var(--subtle-ink);
      font-size: 11px;
      line-height: 1.65;
    }

    .method-output-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 16px 0 9px;
      padding-top: 13px;
      border-top: 1px dashed #dddde5;
      color: var(--muted-ink);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .method-output-label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--purple);
    }

    .method-solutions {
      display: grid;
      gap: 8px;
    }

    .method-solution {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.9);
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .method-solution:hover {
      border-color: #c7c5ef;
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(34,34,44,.06);
    }

    .method-solution.active {
      border-color: var(--purple);
      background: var(--purple-soft);
      box-shadow: inset 3px 0 0 var(--purple);
    }

    .method-solution-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .method-solution-code {
      color: var(--muted-ink);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .1em;
    }

    .method-solution-count {
      color: var(--muted-ink);
      font-size: 9px;
    }

    .method-solution b {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 650;
    }

    .method-solution small {
      display: block;
      margin-top: 5px;
      color: var(--subtle-ink);
      font-size: 10px;
      line-height: 1.5;
    }

    .knowledge-hub {
      position: relative;
      width: min(620px, 90%);
      margin: 6px auto 38px;
      padding: 17px 22px;
      border: 1px solid rgba(112,103,232,.24);
      border-radius: 18px;
      background:
        radial-gradient(circle at 16% 10%, rgba(86,211,205,.12), transparent 32%),
        linear-gradient(135deg, rgba(112,103,232,.1), rgba(255,255,255,.92));
      text-align: center;
      box-shadow: 0 12px 34px rgba(112,103,232,.09);
    }

    .knowledge-hub::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1px;
      height: 39px;
      background: #d6d6df;
    }

    .knowledge-hub small {
      display: block;
      margin-bottom: 6px;
      color: var(--purple);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .13em;
    }

    .knowledge-hub b {
      display: block;
      font-size: 15px;
      font-weight: 650;
    }

    .knowledge-hub span {
      display: block;
      margin-top: 6px;
      color: var(--subtle-ink);
      font-size: 11px;
      line-height: 1.6;
    }

    .cluster-map {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 14px;
      padding-top: 22px;
    }

    .cluster-map::before {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      top: 0;
      height: 1px;
      background: #d6d6df;
    }

    .stage-cluster {
      position: relative;
      min-width: 0;
      padding: 18px 15px 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.64);
    }

    .stage-cluster::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 1px;
      height: 23px;
      background: #d6d6df;
    }

    .cluster-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 11px;
    }

    .cluster-index {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--ink);
      color: #fff;
      font-size: 9px;
      font-weight: 750;
    }

    .cluster-header h4 {
      margin: 1px 0 4px;
      font-size: 14px;
      font-weight: 650;
    }

    .cluster-header span {
      display: block;
      color: var(--purple);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .11em;
    }

    .cluster-goal {
      min-height: 50px;
      margin: 0 0 13px;
      color: var(--subtle-ink);
      font-size: 10px;
      line-height: 1.65;
    }

    .cluster-solutions {
      display: grid;
      gap: 7px;
    }

    .cluster-solution {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.92);
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .cluster-solution:hover {
      border-color: #c6c3f3;
      transform: translateY(-1px);
    }

    .cluster-solution.active {
      border-color: var(--purple);
      background: var(--purple-soft);
      box-shadow: inset 3px 0 0 var(--purple);
    }

    .cluster-solution-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted-ink);
      font-size: 8px;
      font-weight: 700;

      background: radial-gradient(circle, rgba(255,255,255,.72), rgba(112,103,232,.018));

      position: absolute;
      z-index: 2;
      left: 50%;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);

      font-weight: 750;

      color: var(--purple);
    }

    .radial-edges {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scene-solution-edge {
      fill: none;
      stroke: var(--purple);
      stroke-width: 1;
      opacity: .16;
      vector-effect: non-scaling-stroke;
    }

    .scene-solution-edge.active {
      stroke-width: 2;
      opacity: .78;
    }

    .radial-scene-node {
      position: absolute;
      z-index: 6;
      left: 1100px;
      top: 800px;
      width: 250px;
      padding: 20px 18px;
      border: 1px solid var(--purple);
      border-radius: 22px;
      background: #fff;
      text-align: center;
      transform: translate(-50%, -50%);
      box-shadow: 0 18px 48px rgba(112,103,232,.18), 0 0 0 9px rgba(112,103,232,.055);

      display: block;
      color: var(--purple);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .13em;
    }

    .radial-scene-node b {

      margin-top: 7px;
      font-size: 17px;
      font-weight: 680;
    }

    .radial-scene-node span {
      display: block;
      margin-top: 8px;
      color: var(--muted-ink);
      font-size: 9px;
      line-height: 1.5;
    }

    .radial-solution-node,

      position: absolute;
      z-index: 4;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,.97);

      transform: translate(-50%, -50%);

      font-size: 9px;

      color: var(--subtle-ink);

      align-items: center;

    function buildCapabilityEdges(graph) {
      const edges = [];
      const connect = (source, targets, relation) => {
        targets.forEach(target => edges.push({
          id: `edge-${edges.length + 1}`,
          source,
          target,
          relation
        }));
      };

      graph.nodes.roots.forEach(root => connect(root.id, root.childIds, 'contains'));
      graph.nodes.categories.forEach(category => connect(category.id, category.atomIds, 'provides'));
      graph.nodes.scenes.forEach(scene => connect(scene.id, scene.stageIds, 'contains'));
      graph.nodes.stages.forEach(stage => connect(stage.id, stage.solutionIds, 'contains'));
      graph.nodes.solutions.forEach(solution => connect(solution.id, solution.atomIds, 'uses'));
      return edges;
    }

    function validateCapabilityGraph(graph) {
      const collections = Object.values(graph.nodes);
      const allNodes = collections.flat();
      const nodeIds = new Set();
      const atomNames = new Set();

      allNodes.forEach(node => {
        if (nodeIds.has(node.id)) throw new Error(`重复节点ID：${node.id}`);
        nodeIds.add(node.id);
      });
      graph.nodes.atoms.forEach(atom => {
        if (atomNames.has(atom.name)) throw new Error(`重复原子能力名称：${atom.name}`);
        if (!['existing', 'planned'].includes(atom.status)) throw new Error(`原子能力状态无效：${atom.name}`);
        atomNames.add(atom.name);
      });

      const referenceFields = [
        ...graph.nodes.roots.map(node => [node.id, node.childIds]),
        ...graph.nodes.categories.map(node => [node.id, node.atomIds]),
        ...graph.nodes.scenes.map(node => [node.id, node.stageIds]),
        ...graph.nodes.stages.map(node => [node.id, node.solutionIds]),
        ...graph.nodes.solutions.map(node => [node.id, node.atomIds])
      ];
      referenceFields.forEach(([source, targets]) => targets.forEach(target => {
        if (!nodeIds.has(target)) throw new Error(`关系引用了不存在的节点：${source} -> ${target}`);
      }));
    }

    validateCapabilityGraph(capabilityGraph);
    capabilityGraph.edges = buildCapabilityEdges(capabilityGraph);

    const capabilityNodeById = new Map(
      Object.values(capabilityGraph.nodes).flat().map(node => [node.id, node])
    );

    function getNodes(ids) {
      return ids.map(id => capabilityNodeById.get(id));
    }

    function getAtomNames(atomIds, status) {
      return getNodes(atomIds)
        .filter(atom => atom.status === status)
        .map(atom => atom.name);
    }

    const generalData = capabilityGraph.nodes.categories.map(category => ({
      id: category.key,
      name: category.name,
      description: category.description,
      existing: getAtomNames(category.atomIds, 'existing'),
      planned: getAtomNames(category.atomIds, 'planned')
    }));

    const ecommerceData = capabilityGraph.nodes.scenes.map(scene => ({
      id: scene.key,
      name: scene.name,
      description: scene.description,
      stages: getNodes(scene.stageIds).map(stage => ({
        name: stage.name,
        description: stage.description,
        solutions: getNodes(stage.solutionIds).map(solution => ({
          name: solution.name,
          description: solution.description,
          existing: getAtomNames(solution.atomIds, 'existing'),
          planned: getAtomNames(solution.atomIds, 'planned')
        }))
      }))
    }));

      const rules = [
        [/主图/, '商品首图、卖点主图及多版本主图'],
        [/SKU图/, '颜色、款式、规格和套装组合图'],
        [/详情页|内容页面/, '首屏、卖点、参数、对比、场景和信任模块'],
        [/主视觉/, '核心画面、主题字体、色彩与图形语言及多尺寸延展'],
        [/视觉组件/, '背景、边框、标题条、角标、信息卡片和动态贴片'],
        [/短视频|视频制作|视频版本|切片视频|形象短片/, '横竖版视频成片、封面、字幕版和渠道版本'],
        [/图文|信息图/, '可直接发布的图文成品及版式版本'],
        [/页面制作|会场页面|店铺页面/, '页面首屏、楼层模块、商品卡片和终端适配稿'],
        [/模板制作/, '可复用的版式模板、组件和使用规则'],
        [/尺寸适配|版式适配|语言版本适配/, '不同平台、画幅、语言或规格的发布版本'],
        [/迭代/, '根据反馈更新的图片、页面或视频版本'],
        [/数字人形象/, '数字人标准形象、服装、妆发、表情和动作资产'],

        [/广告/, '可直接投放的图片或视频广告及多尺寸版本']

        getNodes(category.atomIds).forEach((atom, atomIndex) => {

        });
      });

      capabilityGraph.nodes.scenes.forEach((scene, sceneIndex) => {
        const x = 3100 + sceneIndex * 410;

    function globalEdgeMarkup(edge, layout) {
      const source = layout.positions.get(edge.source);
      const target = layout.positions.get(edge.target);
      if (!source || !target) return '';
      const x1 = source.x + source.width / 2;
      const y1 = source.y + source.height;
      const x2 = target.x + target.width / 2;
      const y2 = target.y;
      const midY = (y1 + y2) / 2;
      return `<path class="global-edge" data-global-edge data-source="${edge.source}" data-target="${edge.target}"

    function zoomGlobalGraph(nextScale, clientX, clientY) {
      const wrap = document.getElementById('globalGraphWrap');
      if (!wrap) return;
      const previousScale = globalGraphScale;
      const rect = wrap.getBoundingClientRect();
      const anchorX = (clientX ?? (rect.left + rect.width / 2)) - rect.left;
      const anchorY = (clientY ?? (rect.top + rect.height / 2)) - rect.top;
      const contentX = (wrap.scrollLeft + anchorX) / previousScale;
      const contentY = (wrap.scrollTop + anchorY) / previousScale;
      globalGraphScale = Math.max(.16, Math.min(1, nextScale));
      updateGlobalScale();
      wrap.scrollLeft = contentX * globalGraphScale - anchorX;
      wrap.scrollTop = contentY * globalGraphScale - anchorY;
    }

    function focusGlobalNode(nodeId) {
      globalGraphFocus = nodeId;

        edge.classList.toggle('active', active);
        edge.classList.toggle('dimmed', !active);
        if (active) {
          related.add(edge.dataset.source);
          related.add(edge.dataset.target);
        }
      });
      document.querySelectorAll('[data-global-node]').forEach(node => {
        node.classList.toggle('active', node.dataset.globalNode === nodeId);
        node.classList.toggle('dimmed', !related.has(node.dataset.globalNode));

      let dragging = false;
      let startX = 0;
      let startY = 0;

      wrap.addEventListener('pointerdown', event => {
        if (event.target.closest('button')) return;
        dragging = true;

    function buildSceneGraph(scene) {
      const solutions = [];
      const atomMap = new Map();
      const center = { x: 1100, y: 800 };
      const solutionRadius = { x: 420, y: 300 };

      scene.stages.forEach((stage, stageIndex) => {
        stage.solutions.forEach((solution, solutionIndex) => {
          const solutionId = `s-${stageIndex}-${solutionIndex}`;
          solutions.push({ id: solutionId, stageIndex, solutionIndex, stage, solution });

          solution.existing.forEach(name => {
            if (!atomMap.has(name)) atomMap.set(name, { name, status: 'existing', solutionIds: [] });
            atomMap.get(name).solutionIds.push(solutionId);
          });
          solution.planned.forEach(name => {
            if (!atomMap.has(name)) atomMap.set(name, { name, status: 'planned', solutionIds: [] });
            atomMap.get(name).solutionIds.push(solutionId);
          });
        });
      });

      solutions.forEach((item, index) => {
        const angle = -Math.PI / 2 + index * Math.PI * 2 / solutions.length;
        item.angle = angle;
        item.x = center.x + Math.cos(angle) * solutionRadius.x;
        item.y = center.y + Math.sin(angle) * solutionRadius.y;
      });

      const solutionById = new Map(solutions.map(solution => [solution.id, solution]));
      const atomsSorted = [...atomMap.values()].map(atom => {
        const vectors = atom.solutionIds.map(id => solutionById.get(id)?.angle).filter(angle => angle !== undefined);
        const meanX = vectors.reduce((sum, angle) => sum + Math.cos(angle), 0);
        const meanY = vectors.reduce((sum, angle) => sum + Math.sin(angle), 0);
        return { ...atom, anchorAngle: Math.atan2(meanY, meanX) };
      }).sort((a, b) => a.anchorAngle - b.anchorAngle || b.solutionIds.length - a.solutionIds.length);

      const atomRings = [
        { x: 570, y: 405 },
        { x: 680, y: 500 },
        { x: 790, y: 595 },
        { x: 900, y: 690 }
      ];
      const atoms = atomsSorted.map((atom, index) => {
        const angle = -Math.PI + index * Math.PI * 2 / atomsSorted.length;
        const ringIndex = index % atomRings.length;
        const radius = atomRings[ringIndex];
        return {
          ...atom,
          id: `a-${index}`,
          angle,
          x: center.x + Math.cos(angle) * radius.x,
          y: center.y + Math.sin(angle) * radius.y
        };
      });

      const edges = [];

      atoms.forEach(atom => {
        atom.solutionIds.forEach(solutionId => {
          const solution = solutionById.get(solutionId);
          if (solution) edges.push({
            id: `${solutionId}--${atom.id}`,
            solutionId,
            atomId: atom.id,
            status: atom.status,
            x1: solution.x,
            y1: solution.y,
            x2: atom.x,
            y2: atom.y
          });
        });
      });

      return { center, solutions, atoms, edges, canvasWidth: 2200, canvasHeight: 1600 };
    }

    function renderSceneNetwork(scene) {
      const graph = buildSceneGraph(scene);
      const focusedSolution = graph.solutions.find(item => item.id === state.graphFocus);
      const focusedAtom = graph.atoms.find(item => item.id === state.graphFocus);
      const activeSolutionIds = new Set();
      const activeAtomIds = new Set();

      if (focusedSolution) {
        activeSolutionIds.add(focusedSolution.id);
        graph.edges.filter(edge => edge.solutionId === focusedSolution.id).forEach(edge => activeAtomIds.add(edge.atomId));
      } else if (focusedAtom) {
        activeAtomIds.add(focusedAtom.id);
        focusedAtom.solutionIds.forEach(id => activeSolutionIds.add(id));
      }

      const hasFocus = activeSolutionIds.size > 0 || activeAtomIds.size > 0;
      const focusText = focusedSolution
        ? `已聚焦解决方案：${focusedSolution.solution.name}`
        : focusedAtom
          ? `已聚焦原子能力：${focusedAtom.name} · 被 ${focusedAtom.solutionIds.length} 个解决方案复用`
          : '全景模式：全部关系以低对比展示，点击任一节点聚焦一度关联';

      return `

            <div class="graph-modal-header">

            </div>
              <div class="graph-modal-actions">
                <span>${graph.solutions.length} 个解决方案</span>
                <span>${graph.atoms.length} 个原子能力</span>
                <button class="graph-reset" id="graphReset">查看全部关系</button>
                <button class="graph-modal-close" data-close-graph aria-label="关闭知识图谱">×</button>
              </div>
          </div>
            <div class="graph-modal-legend">
              <span><i class="legend-swatch solution"></i>解决方案层</span>
              <span><i class="legend-swatch"></i>已有原子能力</span>
              <span><i class="legend-swatch planned"></i>待建设原子能力</span>
              <span>×N 表示被多个方案复用</span>
            </div>
            <div class="radial-graph-wrap">
              <div class="radial-graph-canvas" style="width:${graph.canvasWidth}px;height:${graph.canvasHeight}px">
                <span class="radial-ring ring-outer"></span>
                <span class="radial-ring ring-middle"></span>
                <span class="radial-ring ring-solution"></span>
                <span class="radial-layer-label atom-label">L3 · ATOMIC CAPABILITIES</span>
                <span class="radial-layer-label solution-label">L2 · SOLUTIONS</span>

                <svg class="radial-edges" viewBox="0 0 ${graph.canvasWidth} ${graph.canvasHeight}" preserveAspectRatio="none" aria-hidden="true">
                  ${graph.solutions.map(item => {
                    const active = activeSolutionIds.has(item.id);
                    return `<path class="scene-solution-edge ${active ? 'active' : ''}" d="M ${graph.center.x} ${graph.center.y} Q ${(graph.center.x + item.x) / 2} ${(graph.center.y + item.y) / 2} ${item.x} ${item.y}"></path>`;
                  }).join('')}
                  ${graph.edges.map(edge => {
                    const active = activeSolutionIds.has(edge.solutionId) && activeAtomIds.has(edge.atomId);
                    const midX = (edge.x1 + edge.x2) / 2;
                    const midY = (edge.y1 + edge.y2) / 2;
                    return `<path class="graph-edge ${edge.status === 'planned' ? 'planned' : ''} ${active ? 'active' : ''}" d="M ${edge.x1} ${edge.y1} Q ${midX} ${midY} ${edge.x2} ${edge.y2}"></path>`;
                  }).join('')}
                </svg>

                <div class="radial-scene-node">
                <small>SCENE OBJECTIVE</small>
                <b>${scene.name}</b>
                <span>${scene.description}</span>
              </div>

              ${graph.solutions.map(item => {
                const active = activeSolutionIds.has(item.id);
                const dimmed = hasFocus && !active;
                return `
                    <button class="radial-solution-node ${active ? 'active' : ''} ${dimmed ? 'dimmed' : ''}"
                    style="left:${item.x}px;top:${item.y}px"
                    data-graph-solution="${item.id}"
                    data-stage-index="${item.stageIndex}"
                    data-solution-index="${item.solutionIndex}"
                    aria-describedby="solutionHelp">
                      <small>${item.stage.name}</small>
                    <b>${item.solution.name}</b>
                  </button>
                `;
              }).join('')}

              ${graph.atoms.map(atom => {
                const active = activeAtomIds.has(atom.id);
                const dimmed = hasFocus && !active;
                return `
                    <button class="radial-atom-node ${atom.status === 'planned' ? 'planned' : ''} ${active ? 'active' : ''} ${dimmed ? 'dimmed' : ''}"
                    style="left:${atom.x}px;top:${atom.y}px"
                    data-graph-atom="${atom.id}">
                    ${atom.name}
                    ${atom.solutionIds.length > 1 ? `<span class="reuse-count">×${atom.solutionIds.length}</span>` : ''}
                  </button>
                `;
              }).join('')}
              </div>
            </div>
            <div class="graph-modal-footer">
              <span>${focusText}</span>
              <span>拖动滚动区域可浏览完整图谱</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderSecondary() {
      const source = state.primary === 'general' ? generalData : ecommerceData;
      secondaryNav.innerHTML = source.map(item =>
        `<button class="secondary-tab ${item.id === state.secondary ? 'active' : ''}" data-secondary="${item.id}">${item.name}</button>`
      ).join('');
      secondaryNav.querySelectorAll('[data-secondary]').forEach(button => {
        button.addEventListener('click', () => {
          state.secondary = button.dataset.secondary;
          state.stage = 0;
          state.solution = 0;
          state.networkExpanded = false;
          state.graphFocus = null;
          state.graphScroll = null;
          render();
        });
      });
    }

    function renderGeneral() {
      document.body.classList.remove('modal-open');
      const item = generalData.find(x => x.id === state.secondary) || generalData[0];
      const existing = item.existing.filter(matches);
      const planned = item.planned.filter(matches);
      const showExisting = state.status === 'all' || state.status === 'existing';
      const showPlanned = state.status === 'all' || state.status === 'planned';

      content.innerHTML = `
        <section class="overview">
          <div>
            <h2>${item.name}</h2>
            <p>${item.description} 已有能力使用 skills 盘点原文名称及本次确认的新增名称；待建设能力使用规划名称。</p>
          </div>
          <div class="stats">
            <div class="stat"><b>${item.existing.length}</b><span>已有技能</span></div>
            <div class="stat"><b>${item.planned.length}</b><span>待建设能力</span></div>
          </div>
        </section>
        <div class="toolbar">
          <span class="toolbar-title">设计能力池</span>
          <div class="filters" aria-label="能力状态筛选">
            <button class="filter-button ${state.status === 'all' ? 'active' : ''}" data-status="all">全部</button>
            <button class="filter-button ${state.status === 'existing' ? 'active' : ''}" data-status="existing">已有</button>
            <button class="filter-button ${state.status === 'planned' ? 'active' : ''}" data-status="planned">待建设</button>
          </div>
        </div>
        <section class="panel atom-panel">
          ${showExisting ? `
            <div class="atom-group">
              <h3 class="group-heading"><span class="status-dot"></span>已有技能 <small>${existing.length}</small></h3>
              <div class="capsules">${existing.map(x => capsule(x, 'existing')).join('') || '<div class="empty">没有匹配的已有能力</div>'}</div>
            </div>` : ''}
          ${showPlanned ? `
            <div class="atom-group">
              <h3 class="group-heading"><span class="status-dot planned"></span>待建设原子能力 <small>${planned.length}</small></h3>
              <div class="capsules">${planned.map(x => capsule(x, 'planned')).join('') || '<div class="empty">没有匹配的待建设能力</div>'}</div>
            </div>` : ''}
        </section>
      `;

      content.querySelectorAll('[data-status]').forEach(button => {
        button.addEventListener('click', () => {
          state.status = button.dataset.status;
          renderGeneral();
        });
      });
    }

    function renderEcommerce() {
      hideSolutionHelp();
      const scene = ecommerceData.find(x => x.id === state.secondary) || ecommerceData[0];
      const selectedStage = scene.stages[state.stage] || scene.stages[0];
      const selectedSolution = state.solution >= 0 ? selectedStage.solutions[state.solution] : null;
      const selectedExisting = new Set(selectedSolution?.existing || []);
      const selectedPlanned = new Set(selectedSolution?.planned || []);
      const allExisting = unique(scene.stages.flatMap(x => x.solutions.flatMap(y => y.existing))).filter(matches);
      const allPlanned = unique(scene.stages.flatMap(x => x.solutions.flatMap(y => y.planned))).filter(matches);
      const solutionCount = scene.stages.reduce((sum, x) => sum + x.solutions.length, 0);

      content.innerHTML = `
        <section class="overview">
          <div>
            <h2>${scene.name}</h2>
              <p>${scene.description} 主视图呈现阶段与解决方案；可通过浮层知识图谱查看全场景的多对多能力复用关系。</p>
          </div>
          <div class="stats">
            <div class="stat"><b>${scene.stages.length}</b><span>方法阶段</span></div>
            <div class="stat"><b>${solutionCount}</b><span>解决方案</span></div>
          </div>
        </section>

        <section class="panel method-panel">
          <div class="method-heading">
            <div>
              <span class="method-kicker">SCENE KNOWLEDGE GRAPH · CAPABILITY CLUSTERS</span>
              <h3>${scene.name}场景知识图谱</h3>
              <p>阶段是围绕场景目标组织的并列能力簇，不代表固定顺序；解决方案可跨簇组合并复用原子能力。</p>
            </div>
            <button class="network-toggle" id="toggleNetwork">
              查看知识图谱
            </button>
          </div>
          <div class="method-rule">
            <b>图谱阅读</b>
            <span>场景目标是中心母节点</span>
            <span>阶段是并列能力簇</span>
            <span>解决方案是可组合节点</span>
            <span>原子能力跨方案复用</span>
            <span>×N 表示复用次数</span>
          </div>
          <div class="knowledge-hub">
              <small>SCENE OBJECTIVE</small>
              <b>${scene.name}</b>
              <span>${scene.description}</span>
            </div>
            <div class="cluster-map">
              ${scene.stages.map((stage, stageIndex) => {
                const visibleSolutions = stage.solutions.filter(solution =>
                  matches(solution.name) ||
                  matches(solution.description) ||
                  solution.existing.some(matches) ||
                  solution.planned.some(matches)
                );
                return `
                  <article class="stage-cluster">
                    <div class="cluster-header">
                      <span class="cluster-index">${String(stageIndex + 1).padStart(2, '0')}</span>
                      <div>
                        <span>CAPABILITY CLUSTER</span>
                        <h4>${stage.name}</h4>
                      </div>
                    </div>
                    <p class="cluster-goal">${stage.description}</p>
                    <div class="cluster-solutions">
                      ${visibleSolutions.map(solution => {
                        const solutionIndex = stage.solutions.indexOf(solution);
                        const active = stageIndex === state.stage && solutionIndex === state.solution;
                        return `
                          <button class="cluster-solution ${active ? 'active' : ''}" data-stage-index="${stageIndex}" data-solution-index="${solutionIndex}" aria-describedby="solutionHelp">
                            <span class="cluster-solution-top">
                              <span>S${String(stageIndex + 1).padStart(2, '0')}.${String(solutionIndex + 1).padStart(2, '0')}</span>
                              <span>${solution.existing.length + solution.planned.length} ATOMS</span>
                            </span>
                            <b>${solution.name}</b>
                          </button>
                        `;
                      }).join('') || '<div class="empty">无匹配方案</div>'}
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
        </section>

        <section class="panel atom-panel">
          <div class="section-heading">
            <div>
              <h3>场景原子能力池</h3>
              <p>所有能力保持可见，选中方案调用的能力会被高亮</p>
            </div>
            <div class="legend">
              <span class="legend-item"><span class="legend-swatch"></span>已有</span>
              <span class="legend-item"><span class="legend-swatch planned"></span>待建设</span>
            </div>
          </div>
          ${selectedSolution ? `
            <div class="atom-callout">
              当前选中：<b>${selectedSolution.name}</b>
              · 调用 ${selectedSolution.existing.length + selectedSolution.planned.length} 项原子能力
            </div>` : ''}
          <div class="atom-group">
            <h3 class="group-heading"><span class="status-dot"></span>已有原子能力 <small>${allExisting.length}</small></h3>
            <div class="capsules">
              ${allExisting.map(x => capsule(x, 'existing', selectedExisting.has(x))).join('') || '<div class="empty">没有匹配的已有能力</div>'}
            </div>
          </div>
          <div class="atom-group">
            <h3 class="group-heading"><span class="status-dot planned"></span>待建设原子能力 <small>${allPlanned.length}</small></h3>
            <div class="capsules">
              ${allPlanned.map(x => capsule(x, 'planned', selectedPlanned.has(x))).join('') || '<div class="empty">没有匹配的待建设能力</div>'}
            </div>
          </div>
        </section>
        ${state.networkExpanded ? renderSceneNetwork(scene) : ''}
      `;
      document.body.classList.toggle('modal-open', state.networkExpanded);
      if (state.networkExpanded) {
        requestAnimationFrame(() => {
          const wrap = content.querySelector('.radial-graph-wrap');
          if (!wrap) return;
          if (state.graphScroll) {
            wrap.scrollLeft = state.graphScroll.left;
            wrap.scrollTop = state.graphScroll.top;
          } else {
            wrap.scrollLeft = Math.max(0, (wrap.scrollWidth - wrap.clientWidth) / 2);
            wrap.scrollTop = Math.max(0, (wrap.scrollHeight - wrap.clientHeight) / 2);
          }
        });
      }

      content.querySelectorAll('.cluster-solution[data-solution-index]').forEach(button => {
        button.addEventListener('click', () => {
          state.stage = Number(button.dataset.stageIndex);
          state.solution = Number(button.dataset.solutionIndex);
          state.graphFocus = `s-${state.stage}-${state.solution}`;
          renderEcommerce();
        });
      });

      document.getElementById('toggleNetwork')?.addEventListener('click', () => {
        state.networkExpanded = true;
        state.graphFocus = null;
        state.graphScroll = null;
        renderEcommerce();
      });

      content.querySelectorAll('[data-graph-solution]').forEach(button => {
        button.addEventListener('click', () => {
          const wrap = content.querySelector('.radial-graph-wrap');
          state.graphScroll = wrap ? { left: wrap.scrollLeft, top: wrap.scrollTop } : null;
          state.stage = Number(button.dataset.stageIndex);
          state.solution = Number(button.dataset.solutionIndex);
          state.graphFocus = button.dataset.graphSolution;
          renderEcommerce();
        });
      });

      content.querySelectorAll('[data-graph-atom]').forEach(button => {
        button.addEventListener('click', () => {
          const wrap = content.querySelector('.radial-graph-wrap');
          state.graphScroll = wrap ? { left: wrap.scrollLeft, top: wrap.scrollTop } : null;
          state.graphFocus = button.dataset.graphAtom;
          renderEcommerce();
        });
      });

      document.getElementById('graphReset')?.addEventListener('click', () => {
        const wrap = content.querySelector('.radial-graph-wrap');
        state.graphScroll = wrap ? { left: wrap.scrollLeft, top: wrap.scrollTop } : null;
        state.graphFocus = null;
        renderEcommerce();
      });

      content.querySelectorAll('[data-close-graph]').forEach(button => {
        button.addEventListener('click', () => {
          state.networkExpanded = false;
          state.graphFocus = null;
          state.graphScroll = null;
          renderEcommerce();
        });
      });

      document.getElementById('graphModal')?.addEventListener('click', event => {
        if (event.target.id === 'graphModal') {
          state.networkExpanded = false;
          state.graphFocus = null;
          state.graphScroll = null;
          renderEcommerce();
        }
      });
      bindSolutionHelp(scene);
    }

    function render() {
      renderSecondary();
      if (state.primary === 'general') renderGeneral();
      else renderEcommerce();
    }

    document.querySelectorAll('[data-primary]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-primary]').forEach(x => x.classList.remove('active'));
        button.classList.add('active');
        state.primary = button.dataset.primary;
        state.secondary = state.primary === 'general' ? generalData[0].id : ecommerceData[0].id;
        state.stage = 0;
        state.solution = 0;
        state.networkExpanded = false;
        state.graphFocus = null;
        state.graphScroll = null;
        state.status = 'all';
        render();
      });
    });

    searchInput.addEventListener('input', event => {
      state.query = event.target.value.trim();
      if (state.primary === 'general') renderGeneral();
      else renderEcommerce();
    });

    document.getElementById('openGlobalNetwork').addEventListener('click', openGlobalGraph);

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && globalGraphHost.innerHTML) {
        closeGlobalGraph();
      } else if (event.key === 'Escape' && state.networkExpanded) {
        state.networkExpanded = false;
        state.graphFocus = null;
        state.graphScroll = null;
        renderEcommerce();
      }
    });

    render();
    if (window.parent !== window || new URLSearchParams(window.location.search).has('network')) {
      openGlobalGraph();
    }
  </script>
</body>
</html>
