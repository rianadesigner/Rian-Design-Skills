<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Logo Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    overflow: hidden;
  }

  /* Noise background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 0;
  }

  .scene {
    position: relative;
    width: 560px;
    height: 600px;
    z-index: 1;
  }

  /* ==============================
     TOP PIECE — silver/white glass
     ============================== */
  .top-piece {
    position: absolute;
    top: 30px;
    left: 160px;
    width: 360px;
    height: 220px;
    z-index: 2;
  }

  .top-piece__shape {
    width: 100%;
    height: 100%;
    position: relative;
    filter: drop-shadow(0 8px 30px rgba(0,0,0,0.5));
  }

  .top-piece__shape svg {
    width: 100%;
    height: 100%;
  }

  /* ================================
     BOTTOM PIECE — prism dispersion
     ================================ */
  .bottom-piece {
    position: absolute;
    top: 220px;
    left: 30px;
    width: 440px;
    height: 340px;
    z-index: 1;
  }

  .bottom-piece__shape {
    position: relative;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 12px 40px rgba(0,0,0,0.6));
  }

  .bottom-piece__shape svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Chromatic layers — positioned absolutely over bottom piece */
  .chroma-layer {
    position: absolute;
    inset: 0;
    overflow: visible;
  }

  .chroma-layer svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Ambient glow */
  .glow {
    position: absolute;
    top: 200px;
    left: -20px;
    width: 350px;
    height: 300px;
    background: radial-gradient(ellipse at 40% 60%, rgba(80,140,255,0.12) 0%, rgba(255,180,50,0.06) 40%, transparent 70%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle animation */
  @keyframes shimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.92; }
  }

  .bottom-piece {
    animation: shimmer 4s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="scene">

  <div class="glow"></div>

  <!-- TOP PIECE: silver/white metallic -->
  <div class="top-piece">
    <div class="top-piece__shape">
      <svg viewBox="0 0 360 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="topGrad" x1="0" y1="0" x2="360" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d8dce6"/>
            <stop offset="0.3" stop-color="#e8eaf0"/>
            <stop offset="0.6" stop-color="#f0f1f5"/>
            <stop offset="0.8" stop-color="#dde0ea"/>
            <stop offset="1" stop-color="#c8ccd8"/>
          </linearGradient>
          <linearGradient id="topShine" x1="100" y1="0" x2="280" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="white" stop-opacity="0.5"/>
            <stop offset="0.4" stop-color="white" stop-opacity="0.15"/>
            <stop offset="1" stop-color="white" stop-opacity="0"/>
          </linearGradient>
          <filter id="topSoft">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
          </filter>
        </defs>
        <!-- Main shape: parallelogram with rounded corners -->
        <path d="M 60 10 Q 62 2, 72 2 L 335 2 Q 350 2, 354 16 L 354 180 Q 354 198, 340 204 L 28 204 Q 10 204, 8 188 L 38 24 Q 42 10, 60 10 Z" fill="url(#topGrad)"/>
        <path d="M 60 10 Q 62 2, 72 2 L 335 2 Q 350 2, 354 16 L 354 180 Q 354 198, 340 204 L 28 204 Q 10 204, 8 188 L 38 24 Q 42 10, 60 10 Z" fill="url(#topShine)"/>
        <!-- Subtle inner highlight -->
        <path d="M 68 16 L 338 16 Q 346 16, 346 24 L 346 176 Q 346 190, 336 196 L 36 196 Q 22 196, 22 184 L 48 30 Q 52 18, 68 16 Z" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
      </svg>
    </div>
  </div>

  <!-- BOTTOM PIECE: prism/chromatic dispersion -->
  <div class="bottom-piece">
    <div class="bottom-piece__shape">
      <svg viewBox="0 0 440 340" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="btmGrad" x1="200" y1="0" x2="200" y2="340" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#e0e3ec"/>
            <stop offset="0.4" stop-color="#eceef3"/>
            <stop offset="0.7" stop-color="#f2f3f7"/>
            <stop offset="1" stop-color="#d4d8e2"/>
          </linearGradient>
          <linearGradient id="btmShine" x1="300" y1="0" x2="100" y2="300" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="white" stop-opacity="0.4"/>
            <stop offset="0.5" stop-color="white" stop-opacity="0.1"/>
            <stop offset="1" stop-color="white" stop-opacity="0"/>
          </linearGradient>
          <!-- Chromatic aberration gradients -->
          <linearGradient id="chromaOuter" x1="40" y1="80" x2="200" y2="280" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff6b35" stop-opacity="0.9"/>
            <stop offset="0.3" stop-color="#cc2200" stop-opacity="0.95"/>
            <stop offset="0.5" stop-color="#1a0a00"/>
            <stop offset="0.7" stop-color="#0044cc" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#00ccff" stop-opacity="0.8"/>
          </linearGradient>
          <linearGradient id="chromaMiddle" x1="60" y1="100" x2="180" y2="260" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#00ddff"/>
            <stop offset="0.25" stop-color="#0088ff"/>
            <stop offset="0.5" stop-color="#220044"/>
            <stop offset="0.75" stop-color="#886600"/>
            <stop offset="1" stop-color="#ccff00" stop-opacity="0.6"/>
          </linearGradient>
          <linearGradient id="chromaInner" x1="80" y1="120" x2="200" y2="250" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ddff00" stop-opacity="0.5"/>
            <stop offset="0.2" stop-color="#00cc44" stop-opacity="0.3"/>
            <stop offset="0.5" stop-color="#1a1a2e"/>
            <stop offset="1" stop-color="#1a1a2e"/>
          </linearGradient>
          <filter id="chromaBlur1">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
          <filter id="chromaBlur2">
            <feGaussianBlur stdDeviation="5"/>
          </filter>
          <filter id="chromaBlur3">
            <feGaussianBlur stdDeviation="2"/>
          </filter>
        </defs>

        <!-- White outer shape -->
        <path id="btmShape" d="M 16 12 L 420 12 Q 434 12, 434 26 L 434 90 Q 434 100, 428 108 L 260 296 Q 248 312, 228 316 L 120 332 Q 96 336, 80 318 L 12 230 Q 2 216, 6 198 L 6 28 Q 6 12, 22 12 Z" fill="url(#btmGrad)"/>
        <path d="M 16 12 L 420 12 Q 434 12, 434 26 L 434 90 Q 434 100, 428 108 L 260 296 Q 248 312, 228 316 L 120 332 Q 96 336, 80 318 L 12 230 Q 2 216, 6 198 L 6 28 Q 6 12, 22 12 Z" fill="url(#btmShine)"/>

        <!-- Chromatic aberration layers (inside bottom-left area) -->
        <!-- Layer 1: outer glow band (red/orange → cyan) -->
        <path d="M 28 40 L 200 40 L 200 100 Q 200 108, 194 114 L 100 230 Q 90 244, 80 250 L 60 266 Q 40 280, 28 264 L 18 230 Q 12 216, 14 200 L 14 56 Q 14 40, 28 40 Z" fill="url(#chromaOuter)" filter="url(#chromaBlur2)"/>

        <!-- Layer 2: middle band (cyan → blue → yellow) -->
        <path d="M 36 52 L 186 52 L 186 96 Q 186 104, 180 110 L 96 216 Q 86 230, 76 236 L 60 248 Q 44 260, 36 244 L 26 216 Q 22 204, 24 192 L 24 66 Q 24 52, 36 52 Z" fill="url(#chromaMiddle)" filter="url(#chromaBlur1)"/>

        <!-- Layer 3: inner band (green/yellow edge) -->
        <path d="M 44 64 L 172 64 L 172 92 Q 172 100, 166 106 L 92 204 Q 82 218, 72 222 L 60 232 Q 48 242, 44 228 L 34 204 Q 30 194, 32 184 L 32 78 Q 32 64, 44 64 Z" fill="url(#chromaInner)" filter="url(#chromaBlur3)"/>

        <!-- Inner dark shape -->
        <path d="M 52 76 L 158 76 L 158 90 Q 158 96, 154 102 L 88 192 Q 80 204, 72 208 L 62 216 Q 52 224, 50 212 L 42 192 Q 38 184, 40 174 L 40 88 Q 40 76, 52 76 Z" fill="#1a1a2e"/>
        <path d="M 52 76 L 158 76 L 158 90 Q 158 96, 154 102 L 88 192 Q 80 204, 72 208 L 62 216 Q 52 224, 50 212 L 42 192 Q 38 184, 40 174 L 40 88 Q 40 76, 52 76 Z" fill="url(#innerDarkGrad)" opacity="0.6"/>

        <linearGradient id="innerDarkGrad" x1="50" y1="76" x2="130" y2="220" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2a2a44"/>
          <stop offset="1" stop-color="#10101a"/>
        </linearGradient>

        <!-- White edge highlight on outer shape -->
        <path d="M 16 12 L 420 12 Q 434 12, 434 26 L 434 90 Q 434 100, 428 108 L 260 296 Q 248 312, 228 316 L 120 332 Q 96 336, 80 318 L 12 230 Q 2 216, 6 198 L 6 28 Q 6 12, 22 12 Z" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="1.5"/>

        <!-- Thin red/cyan chromatic outline on left edge -->
        <path d="M 12 230 Q 2 216, 6 198 L 6 28 Q 6 12, 22 12" fill="none" stroke="#ff4400" stroke-opacity="0.3" stroke-width="1" filter="url(#chromaBlur3)"/>
        <path d="M 14 232 Q 4 218, 8 200 L 8 30 Q 8 14, 24 14" fill="none" stroke="#00ccff" stroke-opacity="0.3" stroke-width="1" filter="url(#chromaBlur3)"/>

        <!-- Bright cyan edge accent -->
        <path d="M 28 50 Q 18 50, 16 64 L 14 190 Q 14 200, 18 210 L 30 236" fill="none" stroke="#00ddff" stroke-opacity="0.5" stroke-width="2" filter="url(#chromaBlur1)"/>

        <!-- Orange/amber edge accent on outer left -->
        <path d="M 22 44 Q 12 44, 10 58 L 8 196 Q 8 206, 14 218 L 28 244" fill="none" stroke="#ff8800" stroke-opacity="0.4" stroke-width="2" filter="url(#chromaBlur2)"/>
      </svg>
    </div>
  </div>

</div>

</body>
</html>
