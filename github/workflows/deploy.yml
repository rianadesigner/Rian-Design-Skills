name: Deploy Next.js to ECS

on:
  push:
    branches:
      - main  # 请确认您的主分支名称是 main 还是 master，如有不同请修改此处

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # 根据您的项目需求调整版本

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # 如果您的构建过程需要环境变量，请在此处添加
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to ECS via SSH
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: ".next/" # 或者 "out/" 如果您是静态导出
          TARGET: "/root/code/Rian-Design-Skills/next-app/.next/" # 服务器上的目标路径
          # 如果是静态导出 (npm run export)，请将 SOURCE 改为 "out/"，TARGET 改为 ".../out/"
          # 下面这行命令用于重启 serve 进程以应用更改（如果是静态文件通常不需要，但为了保险起见）
          SCRIPT_AFTER: |
            cd /root/code/Rian-Design-Skills/next-app
            # 如果是 SSR 模式，可能需要重启进程。如果是纯静态 out 目录，serve 会自动检测文件变化
            # 这里我们强制刷新一下文件权限
            chown -R root:root .next
            echo "Deployment finished at $(date)"
