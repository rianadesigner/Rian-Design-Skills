name: Deploy Next.js Static to ECS

on:
  push:
    branches:
      - main  # ⚠️ 注意：如果您的主分支是 master，请改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js (Static Export)
        run: npm run build
        # 确保您的 package.json 中 build 命令包含 next export 或 output: 'export'

      - name: Deploy to ECS via SSH
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          
          # ✅ 关键配置：同步 out 目录
          SOURCE: "out/"
          TARGET: "/root/code/Rian-Design-Skills/next-app/out/"
          
          # 部署后清理旧文件（避免删除旧页面导致残留）
          ARGS: "-az --delete"
          
          SCRIPT_AFTER: |
            echo "✅ Deployment successful at $(date)"
            # 静态文件更新后，serve 通常会自动检测到变化，无需重启
            # 但为了保险，我们可以检查一下进程状态
            pgrep -f "serve out" || echo "⚠️ Warning: serve process not found!"
