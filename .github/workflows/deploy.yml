      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          # 1. 上传源码到临时目录
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./A-next-app/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/rian-build-temp

          # 2. 远程执行：构建并复制产物到 Nginx 目录
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e # 遇到错误立即停止
          
          echo "🔨 开始构建..."
          cd /root/rian-build-temp
          npm install --legacy-peer-deps
          npm install next@16.1.7 react@19.2.4 react-dom@19.2.4 --legacy-peer-deps
          ./node_modules/.bin/next build
          
          echo "📦 复制产物到 Nginx 目录..."
          # 注意：Next.js 静态导出通常在 out 目录，如果是 SSR 模式请看情况 B
          if [ -d "out" ]; then
              # 清空旧文件并复制新文件
              rm -rf /var/www/rian-app/*
              cp -r out/* /var/www/rian-app/
              # 修复权限 (确保 nginx 用户能读)
              chown -R nginx:nginx /var/www/rian-app
          else
              echo "❌ 错误：未找到 out 目录，请确认是否开启了 output: 'export'"
              exit 1
          fi
          
          echo "🔄 重载 Nginx..."
          nginx -t && systemctl reload nginx
          echo "🎉 部署完成！"
          EOF
