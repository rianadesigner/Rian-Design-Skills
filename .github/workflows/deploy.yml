name: Deploy to ECS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: A-next-app/package-lock.json

      - name: Install dependencies
        working-directory: A-next-app
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Build Next.js
        working-directory: A-next-app
        run: npm run build

      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Checking SSH key format..."
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub
          echo "SSH key format OK"

          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo SSH connection OK"

          echo "Syncing out/ to /var/www/rian-app/ ..."
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./A-next-app/out/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/rian-app/

          echo "Installing portfolio cache policy..."
          scp -i ~/.ssh/deploy_key \
            ./A-next-app/deploy/nginx-performance.conf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/rian-app-performance.conf

          echo "Validating and reloading nginx..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -eu
            target=/etc/nginx/conf.d/rian-app-performance.conf
            backup=${target}.deployment-backup
            had_existing=0

            if [ -f "$target" ]; then
              cp "$target" "$backup"
              had_existing=1
            fi

            install -m 0644 /tmp/rian-app-performance.conf "$target"

            if ! nginx -t; then
              if [ "$had_existing" -eq 1 ]; then
                mv "$backup" "$target"
              else
                rm -f "$target"
              fi
              rm -f /tmp/rian-app-performance.conf
              nginx -t
              exit 1
            fi

            rm -f "$backup" /tmp/rian-app-performance.conf
            systemctl reload nginx
            echo "部署完成"
          '
