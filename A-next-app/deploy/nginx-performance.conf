# Cache only Rian portfolio assets. HTML remains uncached so new deployments
# become visible immediately, while repeat visits reuse hashed Next.js files.
map "$host:$uri" $rian_static_cache_control {
    default "";
    ~^(?:www\.)?rianadesigner\.top:/_next/static/ "public, max-age=31536000, immutable";
    ~^(?:www\.)?rianadesigner\.top:/(?:fonts|images|icons|branding|resume|audio|documents)/ "public, max-age=86400, stale-while-revalidate=604800";
}

add_header Cache-Control $rian_static_cache_control always;
