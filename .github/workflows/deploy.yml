name: Deploy to ECS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        working-directory: next-app
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install next@16.1.7 react@19.2.4 react-dom@19.2.4 --legacy-peer-deps
          ls -la node_modules/.bin | grep next || true
          ./node_modules/.bin/next --version

      - name: Build Next.js
        working-directory: next-app
        run: |
          ./node_modules/.bin/next build

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          SOURCE: "./next-app/"
          TARGET: "/root/rian-build-temp"

          SCRIPT_AFTER: |
            cd /root/rian-build-temp

            npm install --legacy-peer-deps
            npm install next@16.1.7 react@19.2.4 react-dom@19.2.4 --legacy-peer-deps
            ./node_modules/.bin/next build

            nginx -t && systemctl reload nginx

            echo "🎉 部署完成！"
