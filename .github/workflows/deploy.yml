# GitHub Actions 自动部署工作流
# 将此文件保存为：.github/workflows/deploy.yml

name: Deploy to ECS

on:
  push:
    branches: [ main, master ]  # 推送到这些分支时触发部署
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install dependencies
      run: |
        cd next-app || true
        npm install --legacy-peer-deps

    - name: Build Next.js
      run: |
        cd next-app || true
        npm run build

    - name: Deploy via SSH
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
        REMOTE_USER: ${{ secrets.DEPLOY_USER }}
        SOURCE: "."
        TARGET: "/root/rian-build-temp"
        SCRIPT_AFTER: |
          cd /root/rian-build-temp/repo/next-app || cd /root/rian-build-temp/repo
          npm install --legacy-peer-deps
          npm run build
          if [ -d "out" ]; then
            rm -rf /var/www/rian-app/*
            cp -r out/* /var/www/rian-app/
          fi
          nginx -t && systemctl reload nginx
          echo "🎉 部署完成！"
