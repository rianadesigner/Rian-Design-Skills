name: Deploy to ECS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        working-directory: next-app
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install next@16.1.7 react@19.2.4 react-dom@19.2.4 --legacy-peer-deps
          ls -la node_modules/.bin | grep next || true
          ./node_modules/.bin/next --version

      - name: Build Next.js
        working-directory: next-app
        run: |
          ./node_modules/.bin/next build

           - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Checking SSH key format..."
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub
          echo "SSH key format OK"

          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo SSH connection OK"

          echo "Starting rsync..."
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./next-app/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/rian-build-temp

          echo "Running remote deploy script..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          cd /root/rian-build-temp
          npm install --legacy-peer-deps
          npm install next@16.1.7 react@19.2.4 react-dom@19.2.4 --legacy-peer-deps
          ./node_modules/.bin/next build
          nginx -t && systemctl reload nginx
          echo "🎉 部署完成！"
          EOF
